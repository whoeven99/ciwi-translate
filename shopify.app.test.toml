# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
client_id = "dec512b68e658e4f21588e3d4de0e748"
name = "Ciwi.ai:FAT(Test)"
handle = "ciwi-test"
application_url = "https://typescriptfrontend.onrender.com"
embedded = true

[build]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_legal_policies,read_metaobjects,read_online_store_navigation,read_themes,read_translations,unauthenticated_read_metaobjects,unauthenticated_read_product_listings,write_locales,write_markets,write_metaobjects,write_products,write_translations"
optional_scopes = ["read_customer_events", "write_pixels"]

[auth]
redirect_urls = [
  "https://typescriptfrontend.onrender.com/auth/callback",
  "https://typescriptfrontend.onrender.com/auth/shopify/callback",
  "https://typescriptfrontend.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [
  "app_purchases_one_time/update",
  "app_subscriptions/update",
  "app/uninstalled"
]
uri = "/webhooks"
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]

[app_proxy]
url = "https://typescriptfrontend.onrender.com/api/storefront"
# 与正式版 subpath=ciwi 错开，避免同店多 App 被改成 /apps/ciwi-4
subpath = "ciwi-test"
prefix = "apps"

[pos]
embedded = false
